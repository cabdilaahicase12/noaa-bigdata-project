# NOAA Big Data Analysis Cluster
# 9-container distributed setup: HDFS + Spark + Hive + RStudio
# Memory limits tuned for a 16 GB Windows host with Docker Desktop / WSL2.
# If your machine is tight, comment out datanode2 and spark-worker-2 (project
# still demonstrates a distributed cluster with the remaining nodes).

version: "3.8"

services:
  # ===================================================== HDFS NAMENODE
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: unless-stopped
    ports:
      - "9870:9870"     # HDFS web UI
      - "9000:9000"     # HDFS RPC
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
      - ./data/noaa:/data/noaa            # raw downloads visible inside container
    environment:
      - CLUSTER_NAME=noaa
    env_file:
      - ./config/hadoop.env
    mem_limit: 800m

  # ===================================================== HDFS DATANODES
  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    restart: unless-stopped
    depends_on: [namenode]
    volumes:
      - hdfs_datanode1:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./config/hadoop.env
    mem_limit: 600m

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    restart: unless-stopped
    depends_on: [namenode]
    volumes:
      - hdfs_datanode2:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./config/hadoop.env
    mem_limit: 600m

  # ===================================================== HIVE METASTORE DB
  postgres:
    image: postgres:11
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
      - POSTGRES_DB=metastore
    volumes:
      - hive_metastore_db:/var/lib/postgresql/data
    mem_limit: 500m

  # ===================================================== HIVE METASTORE SERVICE
  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    restart: unless-stopped
    depends_on: [namenode, datanode1, postgres]
    command: /opt/hive/bin/hive --service metastore
    ports:
      - "9083:9083"
    environment:
      - SERVICE_PRECONDITION=namenode:9000 datanode1:9864 postgres:5432
    env_file:
      - ./config/hadoop.env
    volumes:
      - ./config/hive-site.xml:/opt/hive/conf/hive-site.xml
    mem_limit: 900m

  # ===================================================== SPARK CLUSTER
  spark-master:
    image: bde2020/spark-master:3.2.1-hadoop3.2
    container_name: spark-master
    restart: unless-stopped
    depends_on: [namenode, hive-metastore]
    ports:
      - "8080:8080"     # Spark Master web UI
      - "7077:7077"     # Spark master RPC
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - SPARK_MASTER_HOST=spark-master
    volumes:
      - ./jobs:/jobs
      - ./config/hive-site.xml:/spark/conf/hive-site.xml
      - ./config/spark-defaults.conf:/spark/conf/spark-defaults.conf
      - ./data/noaa:/data/noaa
    mem_limit: 800m

  spark-worker-1:
    image: bde2020/spark-worker:3.2.1-hadoop3.2
    container_name: spark-worker-1
    restart: unless-stopped
    depends_on: [spark-master]
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1500m
      - SPARK_WORKER_CORES=2
    volumes:
      - ./config/hive-site.xml:/spark/conf/hive-site.xml
      - ./config/spark-defaults.conf:/spark/conf/spark-defaults.conf
    mem_limit: 1800m

  spark-worker-2:
    image: bde2020/spark-worker:3.2.1-hadoop3.2
    container_name: spark-worker-2
    restart: unless-stopped
    depends_on: [spark-master]
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1500m
      - SPARK_WORKER_CORES=2
    volumes:
      - ./config/hive-site.xml:/spark/conf/hive-site.xml
      - ./config/spark-defaults.conf:/spark/conf/spark-defaults.conf
    mem_limit: 1800m

  # ===================================================== RSTUDIO
  rstudio:
    image: rocker/rstudio:4.3.2
    container_name: rstudio
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PASSWORD=test
      - ROOT=TRUE
    volumes:
      - ./R:/home/rstudio/R
      - ./report/graphics:/home/rstudio/graphics
    mem_limit: 1500m

volumes:
  hdfs_namenode:
  hdfs_datanode1:
  hdfs_datanode2:
  hive_metastore_db:
