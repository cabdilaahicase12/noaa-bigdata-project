# Spark default settings tuned for a 16 GB Windows host with the cluster above.
# Each executor gets ~1g; with 2 workers and 2 cores each, total ~2g executor RAM.

spark.master                      spark://spark-master:7077
spark.sql.warehouse.dir           hdfs://namenode:9000/user/hive/warehouse
spark.sql.catalogImplementation   hive
spark.hadoop.hive.metastore.uris  thrift://hive-metastore:9083

spark.driver.memory               800m
spark.executor.memory             1g
spark.executor.cores              2
spark.sql.shuffle.partitions      16

spark.serializer                  org.apache.spark.serializer.KryoSerializer
spark.sql.parquet.compression.codec snappy
